name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries for macroquad (desktop build)
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev
      - run: cargo test

  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK in the macroquad Android image
        run: |
          docker run --rm -v "$PWD":/root/src -w /root/src notfl3/cargo-apk bash -c '
            set -e
            rustup toolchain install stable --profile minimal --target armv7-linux-androideabi,aarch64-linux-android
            cp Cargo.lock /tmp/Cargo.lock.orig
            # cargo-quad-apk bundles an older cargo that reads lockfile v3 only.
            sed -i "s/^version = 4$/version = 3/" Cargo.lock
            status=0
            cargo +stable quad-apk build --release || status=$?
            cp /tmp/Cargo.lock.orig Cargo.lock
            exit $status'
          mkdir -p dist
          cp target/android-artifacts/release/apk/*.apk dist/emberfall.apk
      - uses: actions/upload-artifact@v4
        with:
          name: emberfall-apk
          path: dist/emberfall.apk
